# Experimental no-eBPF dual-stack values for the linux-route Service profile.
#
# Create the kind cluster with kube-proxy disabled, for example:
#   KUBEPROXY_MODE=none IPFAMILY=dual ./contrib/scripts/kind.sh
#
# This profile is intentionally scoped to the service-focused no-eBPF profile:
# kube-proxy is disabled and ClusterIP/NodePort traffic is implemented by the
# no-eBPF nftables backend. Standard NetworkPolicy is left disabled here so
# service validation does not accidentally depend on policy work.
bpf:
  datapathMode: linux-route
  masquerade: false

routingMode: native
autoDirectNodeRoutes: true
endpointRoutes:
  enabled: true

ipv4:
  enabled: true
ipv6:
  enabled: true
k8s:
  requireIPv4PodCIDR: true
  requireIPv6PodCIDR: true

# Keep the existing eBPF KPR/socket-LB disabled. The no-eBPF branch uses a
# separate Linux-rule Service replacement flag instead of overloading
# kubeProxyReplacement=true.
kubeProxyReplacement: false
socketLB:
  enabled: false

noEBPF:
  services:
    enabled: true
  networkPolicy:
    enabled: false

localRedirectPolicy: true

# The experimental no-eBPF nftables backend shells out to nft(8). The CI image
# used by kind-fast does not package nftables yet, so the kind profile exposes
# the Debian node binary and its shared libraries from the host node.
extraHostPathMounts:
  - name: host-nft
    mountPath: /usr/sbin/nft
    hostPath: /usr/sbin/nft
    hostPathType: File
    readOnly: true
  - name: host-libnftables
    mountPath: /lib/x86_64-linux-gnu/libnftables.so.1
    hostPath: /lib/x86_64-linux-gnu/libnftables.so.1
    hostPathType: File
    readOnly: true
  - name: host-libmnl
    mountPath: /lib/x86_64-linux-gnu/libmnl.so.0
    hostPath: /lib/x86_64-linux-gnu/libmnl.so.0
    hostPathType: File
    readOnly: true
  - name: host-libnftnl
    mountPath: /lib/x86_64-linux-gnu/libnftnl.so.11
    hostPath: /lib/x86_64-linux-gnu/libnftnl.so.11
    hostPathType: File
    readOnly: true
  - name: host-libxtables
    mountPath: /lib/x86_64-linux-gnu/libxtables.so.12
    hostPath: /lib/x86_64-linux-gnu/libxtables.so.12
    hostPathType: File
    readOnly: true
  - name: host-libjansson
    mountPath: /lib/x86_64-linux-gnu/libjansson.so.4
    hostPath: /lib/x86_64-linux-gnu/libjansson.so.4
    hostPathType: File
    readOnly: true
  - name: host-libedit
    mountPath: /lib/x86_64-linux-gnu/libedit.so.2
    hostPath: /lib/x86_64-linux-gnu/libedit.so.2
    hostPathType: File
    readOnly: true
  - name: host-libtinfo
    mountPath: /lib/x86_64-linux-gnu/libtinfo.so.6
    hostPath: /lib/x86_64-linux-gnu/libtinfo.so.6
    hostPathType: File
    readOnly: true
  - name: host-libbsd
    mountPath: /lib/x86_64-linux-gnu/libbsd.so.0
    hostPath: /lib/x86_64-linux-gnu/libbsd.so.0
    hostPathType: File
    readOnly: true
  - name: host-libmd
    mountPath: /lib/x86_64-linux-gnu/libmd.so.0
    hostPath: /lib/x86_64-linux-gnu/libmd.so.0
    hostPathType: File
    readOnly: true
  - name: host-libgmp
    mountPath: /lib/x86_64-linux-gnu/libgmp.so.10
    hostPath: /lib/x86_64-linux-gnu/libgmp.so.10
    hostPathType: File
    readOnly: true

# Masquerade/SNAT-sensitive cases are outside the supported no-eBPF scope.
enableIPv4Masquerade: false
enableIPv6Masquerade: false

# Explicit cuts for the service-focused profile.
l7Proxy: false
policyEnforcementMode: never
hostFirewall:
  enabled: false
